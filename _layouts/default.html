<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}物理资料</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <div class="site-branding">
        <h1 class="site-title">
          <a href="{{ '/' | relative_url }}">
            <span class="title-icon">📚</span>
            物理资料
          </a>
        </h1>
        <p class="site-subtitle">知识不应该存在壁垒</p>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="{{ '/' | relative_url }}">首页</a></li>
          <li><a href="{{ '/物理竞赛试卷/' | relative_url }}">竞赛试卷</a></li>
          <li><a href="{{ '/物理书籍/' | relative_url }}">学习资料</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="content-wrapper">
      {% if page.title and page.layout == "page" and page.url != "/" %}
      <div class="page-header">
        <h1 class="page-title">{{ page.title }}</h1>
      </div>
      {% endif %}
      
      <div class="markdown-body">
        {{ content }}
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-info">
        <p>物理资料共享站 · 助力物理学习</p>
      </div>
      <div class="footer-links">
        <a href="https://github.com/gfphylxy/sanhuanshen" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
